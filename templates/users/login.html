{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Đăng nhập - AutoTech{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-cogs fa-3x text-primary mb-2"></i>
                        <h4 class="fw-bold">Đăng nhập</h4>
                        <p class="text-muted">Chào mừng trở lại AutoTech</p>
                    </div>
                    <form action="" method="post">
                        {% csrf_token %}
                        {% crispy form %}
                    </form>
                    <hr>
                    <p class="text-center mb-0">
                        Chưa có tài khoản?
                        <a href="{% url 'users:register' %}" class="text-primary fw-bold">Đăng ký ngay</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
